services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: poststream_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The production build: Express serves the API and the built frontend on one port
  app:
    build: .
    ports:
      - "3002:3000"
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/poststream_development
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all && npm start"

volumes:
  postgres_data:
