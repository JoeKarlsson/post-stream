name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same pinned image `npm run test:visual` uses locally, so screenshot
    # baselines and browsers match exactly
    container: mcr.microsoft.com/playwright:v1.65.0-noble

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: poststream_development
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DB_HOST: postgres
      JWT_SECRET: ci-only-secret
      VISUAL: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Set up the database
        run: |
          npx sequelize-cli db:migrate
          npx sequelize-cli db:seed:all

      - name: Lint and type-check
        run: |
          npm run lint
          npm run type-check

      - name: API and unit tests, with coverage
        run: npm run test:coverage

      - name: End-to-end, accessibility and visual tests
        run: npx playwright test

      - name: Lighthouse (production build, mobile)
        env:
          NODE_ENV: production
          PORT: "4173"
          DATABASE_URL: postgres://postgres:password@postgres:5432/poststream_development
        run: |
          npm run build
          export CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")
          npx -y @lhci/cli@0.16.0 autorun

      # The static demo for GitHub Pages (also exercised by the "demo" Playwright project)
      - name: Build the static demo
        run: npm run build:demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
            coverage/
          if-no-files-found: ignore

  # Publishes the static demo to https://poststream.joekarlsson.com once every check passes
  deploy-demo:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
